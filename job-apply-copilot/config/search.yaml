# Search configuration. This file IS committed (no secrets here) - tune it freely.

run_every_hours: 3          # 2-4h cadence as requested; scheduler reads this

keywords:
  - "Java Engineer"
  - "Java Developer"
  - "Backend Engineer Java"
  - "Java Software Engineer"

locations:
  - "Remote"
  - "United States"

exclude_keywords:            # jobs whose title/description contains these are skipped
  - "Senior Staff"
  - "10+ years"
  - "Security Clearance Required"

sources:
  adzuna:
    enabled: true
    max_results_per_run: 25
  jooble:
    enabled: false
    max_results_per_run: 25
  linkedin_easy_apply:
    enabled: true
    mode: "review_queue"      # never "auto_submit" - always staged for your approval
    max_applications_per_day: 8
    active_window: "any two hours you pick, e.g. 09:00-11:00"
    min_delay_seconds: 45
    max_delay_seconds: 240
  indeed:
    enabled: true
    mode: "review_queue"
  workday_company_sites:
    enabled: true
    mode: "auto_submit"       # only category allowed to auto-submit
